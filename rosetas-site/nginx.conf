
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS para resolver o dominio publico do Railway
    resolver 1.1.1.1 8.8.8.8 valid=30s;

    # Apenas rotas publicas da API
    location ~ ^/api/(catalogo|arquivos|publico|pagamentos/webhook) {
        set $backend https://projetoescarapelasrosetas-production.up.railway.app;

        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_ssl_name projetoescarapelasrosetas-production.up.railway.app;

        proxy_set_header Host projetoescarapelasrosetas-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueia as demais rotas da API no site publico
    location /api/ {
        return 404;
    }

    # React SPA
    location / {
        try_files $uri /index.html;
    }

    # Cache dos arquivos estaticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
