server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker; resolve o nome "backend" a cada requisição
  resolver 127.0.0.11 valid=10s;

  # O site público só enxerga a parte pública da API. /api/admin, /api/producao etc. não passam por aqui.
  location ~ ^/api/(catalogo|arquivos|publico|pagamentos/webhook) {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
