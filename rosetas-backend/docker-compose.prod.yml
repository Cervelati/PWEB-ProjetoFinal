# Produção: um servidor (VPS) com Docker. HTTPS automático pelo Caddy.
#   cp deploy/env.example .env   (e preencha)
#   coloque o JSON da service account do Firebase em ./secrets/firebase.json
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rosetas
      POSTGRES_USER: rosetas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosetas -d rosetas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    environment:
      # sem SPRING_PROFILES_ACTIVE=dev: login só pelo Firebase, sem dados de teste
      DB_URL: jdbc:postgresql://postgres:5432/rosetas
      DB_USER: rosetas
      DB_PASSWORD: ${DB_PASSWORD}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET no .env}
      CORS_ORIGINS: https://${SITE_DOMAIN},https://${ERP_DOMAIN}
      UPLOADS_DIR: /data/uploads
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - fotos:/data/uploads
      - ./secrets/firebase.json:/run/secrets/firebase.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  site:
    build:
      context: ../rosetas-site
      args:
        VITE_BRAND_NAME: ${BRAND_NAME:-Escarapela}
        VITE_DEV_TOOLS: "false"
    restart: unless-stopped
    depends_on:
      - backend

  erp:
    build:
      context: ../rosetas-erp
      args:
        VITE_BRAND_NAME: ${BRAND_NAME:-Escarapela}
        VITE_SITE_URL: https://${SITE_DOMAIN}
        VITE_FIREBASE_API_KEY: ${FIREBASE_API_KEY:?defina FIREBASE_API_KEY no .env}
        VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${FIREBASE_APP_ID}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?defina SITE_DOMAIN no .env}
      ERP_DOMAIN: ${ERP_DOMAIN:?defina ERP_DOMAIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
      - erp

volumes:
  pgdata:
  fotos:
  caddy_data:
  caddy_config:
